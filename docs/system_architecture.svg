<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 1130 500" xmlns="http://www.w3.org/2000/svg"
     font-family="sans-serif" font-size="11">
  <defs>
    <marker id="arr"   markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0,8 3,0 6" fill="#374151"/>
    </marker>
    <marker id="arr-b" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0,8 3,0 6" fill="#1d4ed8"/>
    </marker>
    <marker id="arr-g" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0,8 3,0 6" fill="#15803d"/>
    </marker>
    <marker id="arr-o" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0,8 3,0 6" fill="#b45309"/>
    </marker>
  </defs>

  <rect width="1130" height="500" fill="#ffffff"/>

  <!-- ═══════════════════════════════════════════════
       SLAVE ROBOTS   x=15–225, three boxes
       Robot 0  cy=90    y=45–135
       Robot 1  cy=205   y=160–250
       ⋮                 y=268
       Robot N  cy=320   y=275–365
  ════════════════════════════════════════════════ -->

  <!-- Robot 0 -->
  <rect x="15" y="45" width="210" height="90" rx="7"
        fill="#f8fafc" stroke="#334155" stroke-width="1.5"/>
  <text x="120" y="65" text-anchor="middle" font-size="11.5"
        font-weight="bold" fill="#1e293b">Robot 0 — mrl_slave</text>
  <line x1="15" y1="72" x2="225" y2="72" stroke="#cbd5e1" stroke-width="1"/>
  <text x="30" y="89"  font-size="10.5" fill="#374151">●  LiDAR accumulation + TF merge</text>
  <text x="30" y="107" font-size="10.5" fill="#374151">●  KISS-FasterPFH feature extraction</text>
  <text x="30" y="125" font-size="10.5" fill="#64748b">    serves:  get_registration_data</text>

  <!-- Robot 1 -->
  <rect x="15" y="160" width="210" height="90" rx="7"
        fill="#f8fafc" stroke="#334155" stroke-width="1.5"/>
  <text x="120" y="180" text-anchor="middle" font-size="11.5"
        font-weight="bold" fill="#1e293b">Robot 1 — mrl_slave</text>
  <line x1="15" y1="187" x2="225" y2="187" stroke="#cbd5e1" stroke-width="1"/>
  <text x="30" y="204" font-size="10.5" fill="#374151">●  LiDAR accumulation + TF merge</text>
  <text x="30" y="222" font-size="10.5" fill="#374151">●  KISS-FasterPFH feature extraction</text>
  <text x="30" y="240" font-size="10.5" fill="#64748b">    serves:  get_registration_data</text>

  <!-- Ellipsis -->
  <text x="120" y="268" text-anchor="middle" font-size="22" fill="#64748b">⋮</text>

  <!-- Robot N -->
  <rect x="15" y="275" width="210" height="90" rx="7"
        fill="#f8fafc" stroke="#334155" stroke-width="1.5"/>
  <text x="120" y="295" text-anchor="middle" font-size="11.5"
        font-weight="bold" fill="#1e293b">Robot N — mrl_slave</text>
  <line x1="15" y1="302" x2="225" y2="302" stroke="#cbd5e1" stroke-width="1"/>
  <text x="30" y="319" font-size="10.5" fill="#374151">●  LiDAR accumulation + TF merge</text>
  <text x="30" y="337" font-size="10.5" fill="#374151">●  KISS-FasterPFH feature extraction</text>
  <text x="30" y="355" font-size="10.5" fill="#64748b">    serves:  get_registration_data</text>

  <!-- LiDAR topic arrows -->
  <line x1="120" y1="32" x2="120" y2="45"
        stroke="#15803d" stroke-width="1.5" stroke-dasharray="4,3"
        marker-end="url(#arr-g)"/>
  <text x="125" y="41" font-size="9" fill="#15803d">PointCloud2</text>

  <line x1="120" y1="147" x2="120" y2="160"
        stroke="#15803d" stroke-width="1.5" stroke-dasharray="4,3"
        marker-end="url(#arr-g)"/>
  <text x="125" y="156" font-size="9" fill="#15803d">PointCloud2</text>

  <line x1="120" y1="262" x2="120" y2="275"
        stroke="#15803d" stroke-width="1.5" stroke-dasharray="4,3"
        marker-end="url(#arr-g)"/>
  <text x="125" y="271" font-size="9" fill="#15803d">PointCloud2</text>

  <!-- ═══════════════════════════════════════════════
       SERVICE CALL BUS   x=275  (gap from slave right: 50 px)
  ════════════════════════════════════════════════ -->

  <!-- Stubs slave → bus -->
  <line x1="225" y1="90"  x2="275" y2="90"  stroke="#1d4ed8" stroke-width="1.4" stroke-dasharray="5,3"/>
  <line x1="225" y1="205" x2="275" y2="205" stroke="#1d4ed8" stroke-width="1.4" stroke-dasharray="5,3"/>
  <line x1="225" y1="320" x2="275" y2="320" stroke="#1d4ed8" stroke-width="1.4" stroke-dasharray="5,3"/>

  <!-- Vertical bus -->
  <line x1="275" y1="90" x2="275" y2="320"
        stroke="#1d4ed8" stroke-width="1.4" stroke-dasharray="5,3"/>

  <!-- Arrow bus → master at Robot 1 height (gap 275→340 = 65 px) -->
  <line x1="275" y1="205" x2="340" y2="205"
        stroke="#1d4ed8" stroke-width="2" stroke-dasharray="5,3"
        marker-end="url(#arr-b)"/>
  <text x="282" y="197" text-anchor="middle" font-size="8" fill="#1d4ed8">get_registration_data</text>

  <!-- ═══════════════════════════════════════════════
       MASTER BOX   x=340, y=28, w=680, h=415
       right edge = 1020
  ════════════════════════════════════════════════ -->
  <rect x="340" y="28" width="680" height="415" rx="9"
        fill="#f0fdf4" stroke="#16a34a" stroke-width="2"/>

  <!-- Header bar -->
  <rect x="340" y="28" width="680" height="36" rx="9" fill="#15803d"/>
  <rect x="340" y="46" width="680" height="18" fill="#15803d"/>
  <text x="680" y="53" text-anchor="middle" font-size="13"
        font-weight="bold" fill="#ffffff">mrl_master</text>

  <!-- ── Stage 1: Registration   x=358, w=200, center=458 ── -->
  <rect x="358" y="78" width="200" height="155" rx="7"
        fill="#ffffff" stroke="#334155" stroke-width="1.4"/>
  <text x="458" y="100" text-anchor="middle" font-size="12"
        font-weight="bold" fill="#1e293b">Registration</text>
  <line x1="358" y1="108" x2="558" y2="108" stroke="#e2e8f0" stroke-width="1"/>
  <rect x="369" y="118" width="178" height="26" rx="5"
        fill="#e2e8f0" stroke="#94a3b8" stroke-width="1"/>
  <text x="458" y="136" text-anchor="middle" font-size="11" fill="#1e293b">KISS-Matcher</text>
  <rect x="369" y="151" width="178" height="26" rx="5"
        fill="#e2e8f0" stroke="#94a3b8" stroke-width="1"/>
  <text x="458" y="169" text-anchor="middle" font-size="11" fill="#1e293b">FRICP  (ICP)</text>
  <text x="458" y="222" text-anchor="middle" font-size="9.5" fill="#94a3b8">[pluggable]</text>

  <!-- Arrow Stage 1 → Stage 2 -->
  <line x1="558" y1="156" x2="580" y2="156"
        stroke="#374151" stroke-width="1.4" marker-end="url(#arr)"/>

  <!-- ── Stage 2: ICP Refiner    x=580, w=200, center=680 ── -->
  <rect x="580" y="78" width="200" height="155" rx="7"
        fill="#ffffff" stroke="#94a3b8" stroke-width="1.4" stroke-dasharray="6,3"/>
  <text x="680" y="100" text-anchor="middle" font-size="12"
        font-weight="bold" fill="#475569">ICP Refiner</text>
  <line x1="580" y1="108" x2="780" y2="108" stroke="#e2e8f0" stroke-width="1"/>
  <text x="680" y="132" text-anchor="middle" font-size="10.5" fill="#475569">Optional post-processing</text>
  <text x="680" y="152" text-anchor="middle" font-size="10.5" fill="#475569">using PCL GICP to refine</text>
  <text x="680" y="172" text-anchor="middle" font-size="10.5" fill="#475569">the initial registration</text>
  <text x="680" y="222" text-anchor="middle" font-size="9.5" fill="#94a3b8">[optional]</text>

  <!-- Arrow Stage 2 → Stage 3 -->
  <line x1="780" y1="156" x2="802" y2="156"
        stroke="#374151" stroke-width="1.4" marker-end="url(#arr)"/>

  <!-- ── Stage 3: Pose Graph     x=802, w=200, center=902 ── -->
  <rect x="802" y="78" width="200" height="155" rx="7"
        fill="#ffffff" stroke="#7c3aed" stroke-width="1.4" stroke-dasharray="6,3"/>
  <text x="902" y="100" text-anchor="middle" font-size="12"
        font-weight="bold" fill="#5b21b6">Pose Graph Optimizer</text>
  <line x1="802" y1="108" x2="1002" y2="108" stroke="#ede9fe" stroke-width="1"/>
  <text x="902" y="132" text-anchor="middle" font-size="10.5" fill="#5b21b6">GTSAM  —  Levenberg-Marquardt</text>
  <text x="902" y="152" text-anchor="middle" font-size="10.5" fill="#5b21b6">Topology:  star  or  mesh</text>
  <text x="902" y="172" text-anchor="middle" font-size="10.5" fill="#5b21b6">Huber-robust weighted edges</text>
  <text x="902" y="222" text-anchor="middle" font-size="9.5" fill="#94a3b8">[optional]</text>

  <!-- ── Collect line + TF Publisher ── -->
  <!-- Vertical drops from stage centres to collection line y=262 -->
  <line x1="458" y1="233" x2="458" y2="262" stroke="#374151" stroke-width="1.2"/>
  <line x1="680" y1="233" x2="680" y2="262" stroke="#374151" stroke-width="1.2"/>
  <line x1="902" y1="233" x2="902" y2="262" stroke="#374151" stroke-width="1.2"/>
  <!-- Horizontal collection line -->
  <line x1="458" y1="262" x2="902" y2="262" stroke="#374151" stroke-width="1.2"/>
  <!-- Arrow down to TF Publisher from midpoint x=680 -->
  <line x1="680" y1="262" x2="680" y2="282"
        stroke="#374151" stroke-width="1.4" marker-end="url(#arr)"/>

  <!-- TF Publisher: x=480, w=400, center=680 -->
  <rect x="480" y="282" width="400" height="62" rx="7"
        fill="#ffffff" stroke="#334155" stroke-width="1.4"/>
  <text x="680" y="307" text-anchor="middle" font-size="12"
        font-weight="bold" fill="#1e293b">Static TF Broadcaster</text>
  <text x="680" y="328" text-anchor="middle" font-size="10.5"
        fill="#374151">Publishes calibrated robot → master transforms</text>

  <!-- /tf_static output arrow — starts at TF Publisher right (x=880),
       crosses master border (x=1020), arrowhead lands at x=1110       -->
  <line x1="880" y1="313" x2="1110" y2="313"
        stroke="#b45309" stroke-width="2" stroke-dasharray="6,3"
        marker-end="url(#arr-o)"/>
  <text x="1065" y="303" text-anchor="middle" font-size="10" fill="#b45309">/tf_static</text>

  <!-- ═══════════════════════════════════════════════
       LEGEND
  ════════════════════════════════════════════════ -->
  <line x1="15"  y1="473" x2="50"  y2="473"
        stroke="#15803d" stroke-width="1.5" stroke-dasharray="4,3"
        marker-end="url(#arr-g)"/>
  <text x="57" y="477" font-size="10.5" fill="#374151">ROS2 topic (LiDAR)</text>

  <line x1="248" y1="473" x2="283" y2="473"
        stroke="#1d4ed8" stroke-width="1.5" stroke-dasharray="5,3"
        marker-end="url(#arr-b)"/>
  <text x="290" y="477" font-size="10.5" fill="#374151">ROS2 service call</text>

  <line x1="480" y1="473" x2="515" y2="473"
        stroke="#b45309" stroke-width="1.5" stroke-dasharray="5,3"
        marker-end="url(#arr-o)"/>
  <text x="522" y="477" font-size="10.5" fill="#374151">TF broadcast  (/tf_static)</text>

  <line x1="715" y1="473" x2="750" y2="473"
        stroke="#374151" stroke-width="1.3"
        marker-end="url(#arr)"/>
  <text x="757" y="477" font-size="10.5" fill="#374151">Internal data flow</text>

  <line x1="950" y1="473" x2="985" y2="473"
        stroke="#94a3b8" stroke-width="1.3" stroke-dasharray="5,3"
        marker-end="url(#arr)"/>
  <text x="992" y="477" font-size="10.5" fill="#374151">Optional</text>
</svg>
