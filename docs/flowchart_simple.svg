<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 520 870" xmlns="http://www.w3.org/2000/svg"
     font-family="sans-serif" font-size="12">
  <defs>
    <marker id="a" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0,8 3,0 6" fill="#374151"/>
    </marker>
    <marker id="a-loop" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0,8 3,0 6" fill="#1d4ed8"/>
    </marker>
    <marker id="a-opt" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0,8 3,0 6" fill="#7c3aed"/>
    </marker>
  </defs>

  <rect width="520" height="870" fill="#ffffff"/>

  <!-- Title -->
  <text x="260" y="28" text-anchor="middle" font-size="14"
        font-weight="bold" fill="#111827">MRL — Calibration Process</text>

  <!-- ── 1. START ─────────────────────────────────── -->
  <ellipse cx="260" cy="65" rx="80" ry="22" fill="#1e293b"/>
  <text x="260" y="70" text-anchor="middle" font-size="12"
        fill="white" font-weight="bold">START</text>

  <line x1="260" y1="87" x2="260" y2="108"
        stroke="#374151" stroke-width="1.8" marker-end="url(#a)"/>

  <!-- ── 2. Receive goal ───────────────────────────── -->
  <rect x="110" y="108" width="300" height="52" rx="8"
        fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/>
  <text x="260" y="129" text-anchor="middle" font-weight="bold"
        fill="#14532d">Receive Calibration Goal</text>
  <text x="260" y="149" text-anchor="middle" font-size="10.5"
        fill="#166534">~/calibrate_action  or  ~/calibrate  (Trigger)</text>

  <line x1="260" y1="160" x2="260" y2="181"
        stroke="#374151" stroke-width="1.8" marker-end="url(#a)"/>

  <!-- ── 3. Fetch master cloud ─────────────────────── -->
  <rect x="110" y="181" width="300" height="52" rx="8"
        fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/>
  <text x="260" y="202" text-anchor="middle" font-weight="bold"
        fill="#14532d">Fetch Master Point Cloud</text>
  <text x="260" y="221" text-anchor="middle" font-size="10.5"
        fill="#166534">Local mrl_slave  →  get_registration_data</text>

  <line x1="260" y1="233" x2="260" y2="254"
        stroke="#374151" stroke-width="1.8" marker-end="url(#a)"/>

  <!-- ── 4. For Each Slave  y=254–306, right edge x=410 ─────── -->
  <rect x="110" y="254" width="300" height="52" rx="8"
        fill="#dbeafe" stroke="#2563eb" stroke-width="1.5"/>
  <text x="260" y="275" text-anchor="middle" font-weight="bold"
        fill="#1e40af">Fetch Slave Data  (i = 0 … N)</text>
  <text x="260" y="294" text-anchor="middle" font-size="10.5"
        fill="#1d4ed8">Fetch data  →  Run registration backend</text>

  <line x1="260" y1="306" x2="260" y2="327"
        stroke="#374151" stroke-width="1.8" marker-end="url(#a)"/>

  <!-- ── 5. Compute Transform  y=327–393, centre y=360 ─────── -->
  <rect x="110" y="327" width="300" height="66" rx="8"
        fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/>
  <text x="260" y="347" text-anchor="middle" font-weight="bold"
        fill="#14532d">Compute Transform</text>
  <text x="260" y="365" text-anchor="middle" font-size="10.5"
        fill="#166534">KISS-Matcher (feature-based)  or  FRICP (ICP)</text>
  <text x="260" y="383" text-anchor="middle" font-size="10.5"
        fill="#166534">→  T_master_from_slave  +  quality metrics</text>

  <!-- Loop back: right of GICP Refinement (410,439) → right of Fetch Slave Data (410,280) -->
  <path d="M 410,439 C 480,439 480,280 410,280"
        fill="none" stroke="#1d4ed8" stroke-width="1.5"
        stroke-dasharray="5,3" marker-end="url(#a-loop)"/>
  <text x="490" y="360" font-size="9.5" fill="#1d4ed8"
        text-anchor="middle" transform="rotate(90,490,360)">repeat</text>

  <line x1="260" y1="393" x2="260" y2="413"
        stroke="#374151" stroke-width="1.8" marker-end="url(#a)"/>

  <!-- ── 6. ICP / GICP Refinement (optional)  y=413–465 ─────── -->
  <rect x="110" y="413" width="300" height="52" rx="8"
        fill="#dcfce7" stroke="#16a34a" stroke-width="1.5" stroke-dasharray="5,3"/>
  <text x="260" y="434" text-anchor="middle" font-weight="bold"
        fill="#14532d">GICP Refinement  (optional)</text>
  <text x="260" y="452" text-anchor="middle" font-size="10.5"
        fill="#166534">Refines transform before pose-graph step</text>

  <line x1="260" y1="465" x2="260" y2="490"
        stroke="#374151" stroke-width="1.8" marker-end="url(#a)"/>

  <!-- ── 7. Pose graph diamond  centre y=518 ───────────────── -->
  <polygon points="260,490 370,518 260,546 150,518"
           fill="#fef9c3" stroke="#ca8a04" stroke-width="1.5"/>
  <text x="260" y="514" text-anchor="middle" font-size="11"
        font-weight="bold" fill="#713f12">Pose Graph</text>
  <text x="260" y="531" text-anchor="middle" font-size="11"
        font-weight="bold" fill="#713f12">Optimization?</text>

  <!-- YES branch → GTSAM box -->
  <line x1="370" y1="518" x2="430" y2="518"
        stroke="#7c3aed" stroke-width="1.5" marker-end="url(#a-opt)"/>
  <text x="397" y="511" text-anchor="middle" font-size="10"
        fill="#7c3aed">YES</text>
  <rect x="430" y="496" width="75" height="44" rx="6"
        fill="#ede9fe" stroke="#7c3aed" stroke-width="1.2"/>
  <text x="467" y="514" text-anchor="middle" font-size="9.5"
        font-weight="bold" fill="#4c1d95">GTSAM</text>
  <text x="467" y="530" text-anchor="middle" font-size="9"
        fill="#5b21b6">Optimize</text>
  <!-- GTSAM rejoins main flow -->
  <line x1="467" y1="540" x2="467" y2="580"
        stroke="#7c3aed" stroke-width="1.5"/>
  <line x1="467" y1="580" x2="260" y2="580"
        stroke="#7c3aed" stroke-width="1.5" marker-end="url(#a-opt)"/>

  <!-- NO branch → straight down -->
  <line x1="260" y1="546" x2="260" y2="580"
        stroke="#374151" stroke-width="1.8" marker-end="url(#a)"/>
  <text x="270" y="567" font-size="10" fill="#374151">NO</text>

  <!-- ── 8. Publish TF  y=580–632 ──────────────────── -->
  <rect x="110" y="580" width="300" height="52" rx="8"
        fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/>
  <text x="260" y="601" text-anchor="middle" font-weight="bold"
        fill="#14532d">Publish Static TF Transforms</text>
  <text x="260" y="620" text-anchor="middle" font-size="10.5"
        fill="#166534">StaticTransformBroadcaster  →  /tf_static</text>

  <line x1="260" y1="632" x2="260" y2="653"
        stroke="#374151" stroke-width="1.8" marker-end="url(#a)"/>

  <!-- ── 9. END ─────────────────────────────────────── -->
  <ellipse cx="260" cy="675" rx="80" ry="22" fill="#1e293b"/>
  <text x="260" y="680" text-anchor="middle" font-size="12"
        fill="white" font-weight="bold">DONE</text>

  <!-- ── Legend ────────────────────────────────────── -->
  <rect x="60" y="715" width="400" height="140" rx="8"
        fill="#f9fafb" stroke="#d1d5db" stroke-width="1"/>
  <text x="260" y="735" text-anchor="middle" font-size="11"
        font-weight="bold" fill="#374151">Legend</text>

  <rect x="80"  y="746" width="22" height="16" rx="4"
        fill="#dcfce7" stroke="#16a34a" stroke-width="1.2"/>
  <text x="108" y="759" font-size="10.5" fill="#374151">Process step</text>

  <rect x="80" y="770" width="22" height="16" rx="4"
        fill="#dbeafe" stroke="#2563eb" stroke-width="1.2"/>
  <text x="108" y="783" font-size="10.5" fill="#374151">Loop (per slave robot)</text>

  <rect x="80" y="794" width="22" height="16" rx="4"
        fill="#fef9c3" stroke="#ca8a04" stroke-width="1.2"/>
  <text x="108" y="807" font-size="10.5" fill="#374151">Decision / optional step</text>

  <rect x="80" y="818" width="22" height="16" rx="4"
        fill="#dcfce7" stroke="#16a34a" stroke-dasharray="4,2" stroke-width="1.2"/>
  <text x="108" y="831" font-size="10.5" fill="#374151">Optional process step</text>

  <rect x="260" y="746" width="22" height="16" rx="4"
        fill="#ede9fe" stroke="#7c3aed" stroke-width="1.2"/>
  <text x="288" y="759" font-size="10.5" fill="#374151">GTSAM (optional)</text>

  <line x1="260" y1="778" x2="282" y2="778"
        stroke="#1d4ed8" stroke-width="1.5" stroke-dasharray="5,3"
        marker-end="url(#a-loop)"/>
  <text x="288" y="783" font-size="10.5" fill="#374151">Loop-back</text>

  <ellipse cx="271" cy="802" rx="11" ry="8" fill="#1e293b"/>
  <text x="271" y="806" text-anchor="middle" font-size="8"
        fill="white">S/E</text>
  <text x="288" y="807" font-size="10.5" fill="#374151">Start / End</text>
</svg>
