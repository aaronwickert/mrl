<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 860 540" xmlns="http://www.w3.org/2000/svg"
     font-family="sans-serif" font-size="12">
  <defs>
    <marker id="a" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0,8 3,0 6" fill="#374151"/>
    </marker>
    <marker id="a-blue" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0,8 3,0 6" fill="#1d4ed8"/>
    </marker>
    <marker id="a-green" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0,8 3,0 6" fill="#15803d"/>
    </marker>
    <marker id="a-orange" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0,8 3,0 6" fill="#b45309"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect width="860" height="540" fill="#ffffff"/>

  <!-- Title -->
  <text x="430" y="26" text-anchor="middle" font-size="15"
        font-weight="bold" fill="#111827">
    MRL — Multi-Robot Localization: System Architecture
  </text>

  <!-- ══════════════════════════════════════════════════
       SLAVE ROBOTS  (left column)
       Robot 0  cy=92   y=48–136
       Robot 2  cy=209  y=165–253
       ellipsis         y=275
       Robot N  cy=340  y=295–383   ← moved lower
  ═══════════════════════════════════════════════════ -->

  <!-- Robot 0 -->
  <rect x="20" y="48" width="210" height="88" rx="8"
        fill="#fefce8" stroke="#ca8a04" stroke-width="1.5"/>
  <text x="125" y="67" text-anchor="middle" font-weight="bold" fill="#713f12">Robot 0 — mrc_slave</text>
  <line x1="20" y1="76" x2="230" y2="76" stroke="#fde68a" stroke-width="1"/>
  <text x="35" y="93"  font-size="10.5" fill="#374151">● Accumulates LiDAR point clouds</text>
  <text x="35" y="109" font-size="10.5" fill="#374151">● Extracts KISS-FasterPFH features</text>
  <text x="35" y="125" font-size="10.5" fill="#374151">● Serves: get_registration_data</text>

  <!-- Robot 2 -->
  <rect x="20" y="165" width="210" height="88" rx="8"
        fill="#fefce8" stroke="#ca8a04" stroke-width="1.5"/>
  <text x="125" y="184" text-anchor="middle" font-weight="bold" fill="#713f12">Robot 2 — mrc_slave</text>
  <line x1="20" y1="193" x2="230" y2="193" stroke="#fde68a" stroke-width="1"/>
  <text x="35" y="210" font-size="10.5" fill="#374151">● Accumulates LiDAR point clouds</text>
  <text x="35" y="226" font-size="10.5" fill="#374151">● Extracts KISS-FasterPFH features</text>
  <text x="35" y="242" font-size="10.5" fill="#374151">● Serves: get_registration_data</text>

  <!-- Ellipsis -->
  <text x="125" y="280" text-anchor="middle" font-size="22" fill="#92400e">⋮</text>

  <!-- Robot N  (moved lower: y=295) -->
  <rect x="20" y="295" width="210" height="88" rx="8"
        fill="#fefce8" stroke="#ca8a04" stroke-width="1.5"/>
  <text x="125" y="314" text-anchor="middle" font-weight="bold" fill="#713f12">Robot N — mrc_slave</text>
  <line x1="20" y1="323" x2="230" y2="323" stroke="#fde68a" stroke-width="1"/>
  <text x="35" y="340" font-size="10.5" fill="#374151">● Accumulates LiDAR point clouds</text>
  <text x="35" y="356" font-size="10.5" fill="#374151">● Extracts KISS-FasterPFH features</text>
  <text x="35" y="372" font-size="10.5" fill="#374151">● Serves: get_registration_data</text>

  <!-- LiDAR topic arrows (above each slave) -->
  <line x1="125" y1="36" x2="125" y2="48"
        stroke="#15803d" stroke-width="1.5" stroke-dasharray="4,3"
        marker-end="url(#a-green)"/>
  <text x="130" y="45" font-size="9" fill="#15803d">/pointcloud</text>

  <line x1="125" y1="153" x2="125" y2="165"
        stroke="#15803d" stroke-width="1.5" stroke-dasharray="4,3"
        marker-end="url(#a-green)"/>
  <text x="130" y="162" font-size="9" fill="#15803d">/pointcloud</text>

  <line x1="125" y1="283" x2="125" y2="295"
        stroke="#15803d" stroke-width="1.5" stroke-dasharray="4,3"
        marker-end="url(#a-green)"/>
  <text x="130" y="292" font-size="9" fill="#15803d">/pointcloud</text>

  <!-- ══════════════════════════════════════════════════
       SERVICE CALL BUS
       Vertical bus at x=255, spanning Robot 0–N
       Single labelled arrow exits at Robot 2 height (cy=209)
  ═══════════════════════════════════════════════════ -->

  <!-- Stubs from each slave to bus -->
  <line x1="230" y1="92"  x2="255" y2="92"  stroke="#1d4ed8" stroke-width="1.5" stroke-dasharray="5,3"/>
  <line x1="230" y1="209" x2="255" y2="209" stroke="#1d4ed8" stroke-width="1.5" stroke-dasharray="5,3"/>
  <line x1="230" y1="339" x2="255" y2="339" stroke="#1d4ed8" stroke-width="1.5" stroke-dasharray="5,3"/>

  <!-- Vertical bus -->
  <line x1="255" y1="92" x2="255" y2="339"  stroke="#1d4ed8" stroke-width="1.5" stroke-dasharray="5,3"/>

  <!-- Single arrow into master at Robot 2 height -->
  <line x1="255" y1="209" x2="310" y2="209"
        stroke="#1d4ed8" stroke-width="2" stroke-dasharray="5,3"
        marker-end="url(#a-blue)"/>
  <text x="282" y="202" text-anchor="middle" font-size="9" fill="#1d4ed8">get_registration_data</text>

  <!-- ══════════════════════════════════════════════════
       MASTER NODE  x=310, y=45, w=530, h=415
  ═══════════════════════════════════════════════════ -->
  <rect x="310" y="45" width="530" height="415" rx="10"
        fill="#f0fdf4" stroke="#16a34a" stroke-width="2"/>
  <text x="575" y="66" text-anchor="middle" font-size="13"
        font-weight="bold" fill="#14532d">Master Robot — mrc_master</text>
  <line x1="310" y1="74" x2="840" y2="74" stroke="#86efac" stroke-width="1"/>

  <!-- Interfaces sub-box  (centred on cy=209 → y=169, h=80) -->
  <rect x="328" y="169" width="230" height="80" rx="6"
        fill="#dcfce7" stroke="#4ade80" stroke-width="1"/>
  <text x="443" y="187" text-anchor="middle" font-size="11"
        font-weight="bold" fill="#14532d">Interfaces</text>
  <text x="340" y="205" font-size="10" fill="#166534">Action:  ~/calibrate_action</text>
  <text x="340" y="221" font-size="10" fill="#166534">Service: ~/calibrate  (Trigger)</text>
  <text x="340" y="237" font-size="10" fill="#166534">Sub:     /robot_announcement</text>

  <!-- Registration Backend sub-box (same row) -->
  <rect x="578" y="169" width="245" height="80" rx="6"
        fill="#dcfce7" stroke="#4ade80" stroke-width="1"/>
  <text x="700" y="187" text-anchor="middle" font-size="11"
        font-weight="bold" fill="#14532d">Registration Backend</text>
  <rect x="592" y="196" width="100" height="22" rx="4"
        fill="#4ade80" stroke="#22c55e"/>
  <text x="642" y="212" text-anchor="middle" font-size="10" fill="#14532d">KISS-Matcher</text>
  <rect x="706" y="196" width="100" height="22" rx="4"
        fill="#4ade80" stroke="#22c55e"/>
  <text x="756" y="212" text-anchor="middle" font-size="10" fill="#14532d">FRICP (ICP)</text>
  <text x="700" y="241" text-anchor="middle" font-size="9.5" fill="#374151">[pluggable — selected at runtime]</text>

  <!-- Arrow: Interfaces → Registration -->
  <line x1="558" y1="209" x2="578" y2="209"
        stroke="#374151" stroke-width="1.2" marker-end="url(#a)"/>

  <!-- Pose Graph sub-box (optional, dashed) -->
  <rect x="328" y="270" width="495" height="82" rx="6"
        fill="#dcfce7" stroke="#4ade80" stroke-width="1" stroke-dasharray="6,3"/>
  <text x="575" y="290" text-anchor="middle" font-size="11"
        font-weight="bold" fill="#14532d">Pose Graph Optimizer  (optional — GTSAM)</text>
  <text x="345" y="310" font-size="10" fill="#166534">● Topology: star (master ↔ all) or mesh (all pairwise)</text>
  <text x="345" y="328" font-size="10" fill="#166534">● Huber-robust edges weighted by reg. RMSE  →  Levenberg-Marquardt</text>

  <!-- Vertical connector: Registration row → Pose Graph -->
  <line x1="575" y1="249" x2="575" y2="270"
        stroke="#374151" stroke-width="1.2" marker-end="url(#a)"/>

  <!-- ICP Refiner sub-box (optional, dashed) -->
  <rect x="328" y="375" width="230" height="55" rx="6"
        fill="#dcfce7" stroke="#4ade80" stroke-width="1" stroke-dasharray="6,3"/>
  <text x="443" y="395" text-anchor="middle" font-size="11"
        font-weight="bold" fill="#14532d">ICP Refiner  (optional)</text>
  <text x="443" y="414" text-anchor="middle" font-size="10" fill="#166534">PCL ICP post-processing</text>

  <!-- TF Publisher sub-box -->
  <rect x="578" y="375" width="245" height="55" rx="6"
        fill="#dcfce7" stroke="#4ade80" stroke-width="1"/>
  <text x="700" y="395" text-anchor="middle" font-size="11"
        font-weight="bold" fill="#14532d">Static TF Broadcaster</text>
  <text x="700" y="414" text-anchor="middle" font-size="10" fill="#166534">Publishes robot → master transforms</text>

  <!-- Vertical connectors: Pose Graph → ICP / TF -->
  <line x1="443" y1="352" x2="443" y2="375"
        stroke="#374151" stroke-width="1.2" marker-end="url(#a)"/>
  <line x1="700" y1="352" x2="700" y2="375"
        stroke="#374151" stroke-width="1.2" marker-end="url(#a)"/>

  <!-- Top part of master (above Interfaces) -->
  <rect x="328" y="83" width="495" height="75" rx="6"
        fill="#dcfce7" stroke="#4ade80" stroke-width="1"/>
  <text x="575" y="101" text-anchor="middle" font-size="11"
        font-weight="bold" fill="#14532d">Calibration Trigger</text>
  <text x="345" y="120" font-size="10" fill="#166534">● Receive calibration goal via Action or Service</text>
  <text x="345" y="137" font-size="10" fill="#166534">● Build robot list from /robot_announcement + static config</text>
  <text x="345" y="153" font-size="10" fill="#166534">● Fetch local point cloud from co-located mrc_slave</text>

  <!-- Arrow: Calibration Trigger → Interfaces -->
  <line x1="575" y1="158" x2="575" y2="169"
        stroke="#374151" stroke-width="1.2" marker-end="url(#a)"/>

  <!-- /tf_static output arrow (exits right of TF box) -->
  <line x1="823" y1="402" x2="850" y2="402"
        stroke="#b45309" stroke-width="1.8" stroke-dasharray="5,3"
        marker-end="url(#a-orange)"/>
  <text x="838" y="395" font-size="9" fill="#b45309" text-anchor="middle">/tf_static</text>

  <!-- ══════════════════════════════════════════════════
       LEGEND  — one row across full width
  ═══════════════════════════════════════════════════ -->
  <rect x="20" y="478" width="820" height="50" rx="6"
        fill="#f9fafb" stroke="#d1d5db" stroke-width="1"/>

  <!-- Item 1 -->
  <line x1="38" y1="499" x2="68" y2="499"
        stroke="#15803d" stroke-width="1.5" stroke-dasharray="4,3"
        marker-end="url(#a-green)"/>
  <text x="74" y="503" font-size="10.5" fill="#374151">ROS2 topic (LiDAR)</text>

  <!-- Item 2 -->
  <line x1="248" y1="499" x2="278" y2="499"
        stroke="#1d4ed8" stroke-width="1.5" stroke-dasharray="5,3"
        marker-end="url(#a-blue)"/>
  <text x="284" y="503" font-size="10.5" fill="#374151">ROS2 service call</text>

  <!-- Item 3 -->
  <line x1="458" y1="499" x2="488" y2="499"
        stroke="#b45309" stroke-width="1.5" stroke-dasharray="5,3"
        marker-end="url(#a-orange)"/>
  <text x="494" y="503" font-size="10.5" fill="#374151">TF broadcast  (/tf_static)</text>

  <!-- Item 4 -->
  <line x1="668" y1="499" x2="698" y2="499"
        stroke="#374151" stroke-width="1.2"
        marker-end="url(#a)"/>
  <text x="704" y="503" font-size="10.5" fill="#374151">Internal data flow</text>

  <!-- Second legend row -->
  <rect x="38" y="510" width="14" height="14" rx="3"
        fill="#fefce8" stroke="#ca8a04" stroke-width="1.2"/>
  <text x="58" y="522" font-size="10.5" fill="#374151">Slave robot node</text>

  <rect x="248" y="510" width="14" height="14" rx="3"
        fill="#dcfce7" stroke="#4ade80" stroke-width="1.2"/>
  <text x="268" y="522" font-size="10.5" fill="#374151">Master node / internals</text>

  <rect x="458" y="510" width="14" height="14" rx="3"
        fill="#dcfce7" stroke="#4ade80" stroke-width="1.2"
        stroke-dasharray="4,2"/>
  <text x="478" y="522" font-size="10.5" fill="#374151">Optional component</text>
</svg>
